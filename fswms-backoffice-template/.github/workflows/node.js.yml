name: Build & Push Docker Image

on:
  push:
    branches: [ "main", "Dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ví dụ build Dockerfile nằm trong thư mục backend/ (hoặc frontend/)
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend    # Trỏ đúng thư mục chứa Dockerfile của backend
          push: ${{ github.event_name != 'pull_request' }} # Chỉ push khi merge, tạo PR chỉ test build
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
